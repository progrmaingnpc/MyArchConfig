[config]
reload_apps = true

[config.reload_apps_list]
kitty = true
gtk_theme = true

[config.wallpaper]
command = "awww"          # or hyprpaper/swaybg — whatever you use
arguments = ["img", "--transition-type", "center"]
set = true

[templates.hyprland]
input_path = '~/.config/matugen/templates/colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = "hyprctl reload"

[templates.kitty]
input_path = '~/.config/matugen/templates/current-theme.conf'
output_path = '~/.config/kitty/current-theme.conf'
post_hook = "kill -SIGUSR1 $(pgrep -x kitty)"

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell-colors.json'
output_path = '~/.local/state/quickshell/generated/quickshell-colors.json'

[templates.walker]
input_path = '~/.config/matugen/templates/walker-style.css'
output_path = '~/.config/walker/themes/default/style.css'
post_hook = "pkill walker; walker --gapplication-service &"

[templates.hyprtoolkit]
input_path = '~/.config/matugen/templates/hyprtoolkit.conf'
output_path = '~/.config/hypr/hyprtoolkit.conf'
post_hook = "hyprctl reload"
