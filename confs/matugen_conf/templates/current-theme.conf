# Foreground and Background
foreground           #{{colors.on_background.default.hex_stripped}}
background           #{{colors.background.default.hex_stripped}}
selection_foreground #{{colors.on_primary.default.hex_stripped}}
selection_background #{{colors.primary.default.hex_stripped}}

# Transparency settings (Keeps live reloads translucent)
background_opacity         0.7
dynamic_background_opacity yes

# Cursor colors
cursor               #{{colors.on_background.default.hex_stripped}}
cursor_text_color    #{{colors.background.default.hex_stripped}}

# URL underline color
url_color            #{{colors.primary.default.hex_stripped}}

# The 16 terminal colors
color0  #{{colors.surface.default.hex_stripped}}
color8  #{{colors.surface_bright.default.hex_stripped}}

color1  #{{colors.error.default.hex_stripped}}
color9  #{{colors.error_container.default.hex_stripped}}

color2  #{{colors.tertiary.default.hex_stripped}}
color10 #{{colors.tertiary_container.default.hex_stripped}}

color3  #{{colors.primary_container.default.hex_stripped}}
color11 #{{colors.inverse_primary.default.hex_stripped}}

color4  #{{colors.primary.default.hex_stripped}}
color12 #{{colors.on_primary_container.default.hex_stripped}}

color5  #{{colors.secondary.default.hex_stripped}}
color13 #{{colors.secondary_container.default.hex_stripped}}

color6  #{{colors.outline.default.hex_stripped}}
color14 #{{colors.on_secondary_container.default.hex_stripped}}

color7  #{{colors.on_surface_variant.default.hex_stripped}}
color15 #{{colors.on_surface.default.hex_stripped}}
